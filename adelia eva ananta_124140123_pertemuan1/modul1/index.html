<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini POS - Kasir Kantin &amp; Toko Kampus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ambient-canvas" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="ambient-orb orb-4"></div>
  </div>

  <div class="app-wrapper">

    <!-- HEADER -->
    <header class="glass-card app-header">
      <div class="header-branding">
        <div class="brand-icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div>
          <h1>Mini POS</h1>
          <p>Kasir Kantin &amp; Toko Kampus</p>
        </div>
      </div>
    </header>

    <main class="pos-layout">

      <!-- KOLOM KIRI: FORM INPUT -->
      <section class="glass-card">
        <div class="card-header-bar">
          <h2><span>📦</span> Input Barang</h2>
          <span class="count-indicator">Cepat &amp; Praktis</span>
        </div>

        <form id="form-barang" autocomplete="off" novalidate>
          <div class="form-group">
            <label for="nama" class="form-label">Nama Barang</label>
            <input type="text" id="nama" class="form-input" placeholder="Contoh: Es Teh Manis">
            <small class="error" id="error-nama"></small>
          </div>

          <div class="form-group">
            <label for="harga" class="form-label">Harga Satuan (Rp)</label>
            <div class="input-wrapper">
              <span class="input-prefix">Rp</span>
              <input type="number" id="harga" class="form-input has-prefix" placeholder="Minimal 500">
            </div>
            <small class="error" id="error-harga"></small>
          </div>

          <div class="form-group">
            <label for="qty" class="form-label">Jumlah (Qty)</label>
            <input type="number" id="qty" class="form-input" placeholder="Minimal 1" value="1">
            <small class="error" id="error-qty"></small>
          </div>

          <button type="submit" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Tambah ke Keranjang
          </button>
        </form>

        <!-- Menu favorit: hanya mengisi form, tetap lewat validasi -->
        <div class="quick-preset-container">
          <div class="quick-preset-title">Menu Favorit Cepat</div>
          <div class="preset-chips-list">
            <button type="button" class="preset-chip" data-nama="Es Teh" data-harga="4000">🧊 Es Teh (4k)</button>
            <button type="button" class="preset-chip" data-nama="Ayam Geprek" data-harga="15000">🍗 Ayam Geprek (15k)</button>
            <button type="button" class="preset-chip" data-nama="Gorengan" data-harga="2000">🥟 Gorengan (2k)</button>
            <button type="button" class="preset-chip" data-nama="Kopi Susu" data-harga="8000">☕ Kopi Susu (8k)</button>
          </div>
        </div>
      </section>

      <!-- KOLOM KANAN -->
      <section class="pos-col-right">

        <!-- TABEL KERANJANG -->
        <div class="glass-card">
          <div class="card-header-bar">
            <h2><span>🛒</span> Keranjang Belanja</h2>
          </div>
          <div class="table-responsive-container">
            <table class="cart-table">
              <thead>
                <tr>
                  <th>No</th>
                  <th>Nama Barang</th>
                  <th class="angka">Harga Satuan</th>
                  <th class="angka">Qty</th>
                  <th class="angka">Subtotal</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="tabel-keranjang"></tbody>
            </table>
          </div>
        </div>

        <!-- RINGKASAN PEMBAYARAN -->
        <div class="glass-card">
          <div class="card-header-bar">
            <h2><span>💳</span> Ringkasan &amp; Pembayaran</h2>
            <span class="promo-badge-tag">Promo: HEMAT10</span>
          </div>

          <div class="summary-row">
            <span>Total Belanja</span>
            <strong class="summary-val" id="total-belanja">Rp 0</strong>
          </div>

          <div class="form-group promo-group">
            <label for="kode-promo" class="form-label">Kode Promo (opsional)</label>
            <input type="text" id="kode-promo" class="form-input promo-input" placeholder="HEMAT10">
            <small class="hint" id="info-diskon"></small>
          </div>

          <div class="summary-row promo-row">
            <span>Diskon</span>
            <strong class="summary-val" id="nominal-diskon">Rp 0</strong>
          </div>

          <div class="total-akhir-banner">
            <span class="total-akhir-label">Total Akhir</span>
            <strong class="total-akhir-amount" id="total-akhir">Rp 0</strong>
          </div>

          <div class="payment-grid">
            <div class="form-group">
              <label for="uang-bayar" class="form-label">Uang Bayar (Rp)</label>
              <div class="input-wrapper">
                <span class="input-prefix">Rp</span>
                <input type="number" id="uang-bayar" class="form-input has-prefix" placeholder="0">
              </div>
            </div>
            <div class="form-group">
              <span class="form-label">Kembalian</span>
              <div class="change-display-box" id="kembalian">-</div>
            </div>
          </div>

          <p id="status-bayar" class="status"></p>

          <div class="btn-reset-wrap">
            <button type="button" id="btn-reset" class="btn">Transaksi Baru / Reset</button>
          </div>
        </div>

      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
